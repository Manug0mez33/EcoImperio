<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <rect width="100%" height="100%" fill="#022C22"/>
  
  <text x="60" y="60" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="28" fill="#ECFDF5">ESCÁNER IOT & SELECTOR MANUAL DE CONTINGENCIA</text>
  <text x="60" y="92" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="15" fill="#A7F3D0">Heurística de Tolerancia a Errores de Nielsen: visión artificial y fallback accesible para reciclar sin fricción</text>

  <!-- Tag de Estado -->
  <rect x="1130" y="45" width="210" height="32" rx="8" fill="#065F46"/>
  <text x="1235" y="66" font-family="monospace" font-weight="700" font-size="13" fill="#6EE7B7" text-anchor="middle">NIELSEN HEURISTIC #9</text>

  <!-- COLUMNA 1: ESCANER DE CAMARA -->
  <g transform="translate(60, 130)">
    <rect width="400" height="710" rx="32" fill="#064E3B" stroke="#047857" stroke-width="4"/>
    <text x="30" y="45" font-family="sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">1. Reconocimiento Óptico QR</text>
    <!-- Visor -->
    <rect x="25" y="70" width="350" height="420" rx="20" fill="#020617"/>
    <rect x="65" y="110" width="270" height="270" rx="20" fill="none" stroke="#34D399" stroke-width="4" stroke-dasharray="20,10"/>
    <line x1="80" y1="245" x2="320" y2="245" stroke="#10B981" stroke-width="6"/>
    <!-- Mock QR code center -->
    <rect x="140" y="185" width="120" height="120" fill="#059669" opacity="0.4"/>
    <text x="200" y="415" font-family="sans-serif" font-weight="700" font-size="12" fill="#A7F3D0" text-anchor="middle">Campana: Plaza Olmos #04</text>
    <!-- Botón Linterna -->
    <rect x="130" y="440" width="140" height="36" rx="18" fill="#065F46" stroke="#34D399" stroke-width="1.5"/>
    <text x="200" y="463" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">🔦 Encender Linterna</text>
    <!-- Notas -->
    <rect x="25" y="510" width="350" height="170" rx="16" fill="#022C22" stroke="#059669" stroke-width="1.5"/>
    <text x="40" y="540" font-family="sans-serif" font-weight="800" font-size="13" fill="#6EE7B7">Validación Óptica Automática</text>
    <text x="40" y="565" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Lectura instantánea en &lt; 400 ms.</text>
    <text x="40" y="590" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Apertura de servomotor de compuerta.</text>
    <text x="40" y="615" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Celdas de carga NIR certifican el pesaje.</text>
    <text x="40" y="640" font-family="sans-serif" font-size="11" fill="#A7F3D0">• Acreditación inmediata de EcoPuntos.</text>
  </g>

  <!-- COLUMNA 2: SELECTOR MANUAL FALLBACK -->
  <g transform="translate(500, 130)">
    <rect width="400" height="710" rx="32" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <text x="30" y="45" font-family="sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">2. Selector Manual 2x2</text>
    <text x="30" y="70" font-family="sans-serif" font-size="12" fill="#94A3B8">Contingencia ante cámara dañada o sol directo</text>
    <!-- Grid 2x2 -->
    <g transform="translate(25, 95)">
      <!-- PET -->
      <rect width="165" height="110" rx="16" fill="#065F46" stroke="#34D399" stroke-width="2"/>
      <text x="82" y="50" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">Plásticos PET</text>
      <text x="82" y="75" font-family="sans-serif" font-size="11" fill="#D1FAE5" text-anchor="middle">+10 pts por botella</text>
      <!-- Cartón -->
      <rect x="185" width="165" height="110" rx="16" fill="#0F766E" stroke="#2DD4BF" stroke-width="2"/>
      <text x="267" y="50" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">Papel y Cartón</text>
      <text x="267" y="75" font-family="sans-serif" font-size="11" fill="#CCFBF1" text-anchor="middle">+15 pts por kilo</text>
      <!-- Latas -->
      <rect y="125" width="165" height="110" rx="16" fill="#047857" stroke="#6EE7B7" stroke-width="2"/>
      <text x="82" y="175" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">Latas Aluminio</text>
      <text x="82" y="200" font-family="sans-serif" font-size="11" fill="#D1FAE5" text-anchor="middle">+20 pts por unidad</text>
      <!-- Vidrio (Alerta) -->
      <rect x="185" y="125" width="165" height="110" rx="16" fill="#78350F" stroke="#F59E0B" stroke-width="2"/>
      <text x="267" y="170" font-family="sans-serif" font-weight="900" font-size="14" fill="#FCD34D" text-anchor="middle">Vidrio</text>
      <text x="267" y="195" font-family="sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">(Solo Punto Limpio)</text>
      <text x="267" y="212" font-family="sans-serif" font-weight="800" font-size="9" fill="#FBBF24" text-anchor="middle">Ver Punto Cercano &rarr;</text>
    </g>
    <!-- Regla de Prevención -->
    <rect x="25" y="360" width="350" height="320" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="40" y="395" font-family="sans-serif" font-weight="800" font-size="14" fill="#FCD34D">Prevención Ecológica de Errores</text>
    <text x="40" y="425" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Las campanas comunes no admiten vidrio.</text>
    <text x="40" y="450" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Si el vecino toca "Vidrio", la app bloquea</text>
    <text x="40" y="470" font-family="sans-serif" font-size="11" fill="#E2E8F0">  el depósito y redirige al Punto Limpio</text>
    <text x="40" y="490" font-family="sans-serif" font-size="11" fill="#E2E8F0">  Plaza Olmos con operario municipal.</text>
    <text x="40" y="525" font-family="sans-serif" font-size="11" fill="#94A3B8">• Evita la rotura de botellas en campanas</text>
    <text x="40" y="545" font-family="sans-serif" font-size="11" fill="#94A3B8">  y lesiones a los recuperadores urbanos.</text>
  </g>

  <!-- COLUMNA 3: BENEFICIOS ACCESIBLES -->
  <g transform="translate(940, 130)">
    <rect width="400" height="710" rx="32" fill="#0B132B" stroke="#1E293B" stroke-width="4"/>
    <text x="30" y="45" font-family="sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">3. Accesibilidad & Movimiento</text>
    <text x="30" y="70" font-family="sans-serif" font-size="12" fill="#94A3B8">Diseño inclusivo para situaciones reales</text>
    
    <rect x="25" y="100" width="350" height="170" rx="18" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <text x="45" y="135" font-family="sans-serif" font-weight="800" font-size="14" fill="#6EE7B7">Reducción de Movimiento</text>
    <text x="45" y="160" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Respeta 'prefers-reduced-motion'.</text>
    <text x="45" y="185" font-family="sans-serif" font-size="11" fill="#E2E8F0">• El láser animado se congela para usuarios</text>
    <text x="45" y="205" font-family="sans-serif" font-size="11" fill="#E2E8F0">  con sensibilidad vestibular o mareos.</text>
    <text x="45" y="235" font-family="sans-serif" font-size="10" fill="#A7F3D0">Criterio WCAG 2.2.2 (Pausa, Detención)</text>

    <rect x="25" y="295" width="350" height="170" rx="18" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <text x="45" y="330" font-family="sans-serif" font-weight="800" font-size="14" fill="#38BDF8">Feedback Háptico & Sonoro</text>
    <text x="45" y="355" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Vibración corta al detectar el código.</text>
    <text x="45" y="380" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Beep auditivo opcional para confirmación.</text>
    <text x="45" y="405" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Toast flotante con 'aria-live="polite"'.</text>
    <text x="45" y="435" font-family="sans-serif" font-size="10" fill="#7DD3FC">Accesible para usuarios con ceguera total</text>

    <rect x="25" y="490" width="350" height="190" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="45" y="525" font-family="sans-serif" font-weight="800" font-size="14" fill="#FCD34D">Prueba de Campo Monomanual</text>
    <text x="45" y="550" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Botón central accesible con un solo pulgar.</text>
    <text x="45" y="575" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Altura de 56px según la Ley de Fitts.</text>
    <text x="45" y="600" font-family="sans-serif" font-size="11" fill="#E2E8F0">• Se opera mientras se sostiene la bolsa</text>
    <text x="45" y="620" font-family="sans-serif" font-size="11" fill="#E2E8F0">  de reciclables con la otra mano.</text>
  </g>
</svg>