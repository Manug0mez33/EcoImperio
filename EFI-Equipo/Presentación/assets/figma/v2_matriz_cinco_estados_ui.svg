<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <rect width="100%" height="100%" fill="#0F172A"/>
  
  <text x="60" y="60" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="28" fill="#F8FAFC">SISTEMA ATÓMICO: LOS 5 ESTADOS OBLIGATORIOS UI</text>
  <text x="60" y="92" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="15" fill="#94A3B8">Cumplimiento estricto de la Definition of Done (DoD): validación de componentes interactivos en reposo, interacción y foco</text>

  <!-- Tag de Estado -->
  <rect x="1150" y="45" width="190" height="32" rx="8" fill="#047857"/>
  <text x="1245" y="66" font-family="monospace" font-weight="700" font-size="13" fill="#A7F3D0" text-anchor="middle">5 UI STATES MATRIX</text>

  <!-- COLUMNA 1: DEFAULT -->
  <g transform="translate(60, 130)">
    <rect width="240" height="710" rx="24" fill="#1E293B" stroke="#334155" stroke-width="3"/>
    <rect x="20" y="20" width="200" height="36" rx="10" fill="#334155"/>
    <text x="120" y="44" font-family="sans-serif" font-weight="800" font-size="13" fill="#F8FAFC" text-anchor="middle">1. DEFAULT</text>
    
    <text x="24" y="90" font-family="sans-serif" font-size="11" fill="#94A3B8">Botón Primario:</text>
    <rect x="20" y="105" width="200" height="48" rx="14" fill="#065F46"/>
    <text x="120" y="135" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">Confirmar Depósito</text>

    <text x="24" y="190" font-family="sans-serif" font-size="11" fill="#94A3B8">Switch de Accesibilidad:</text>
    <rect x="20" y="205" width="200" height="50" rx="14" fill="#0F172A"/>
    <text x="35" y="235" font-family="sans-serif" font-size="12" fill="#E2E8F0">Modo Oscuro</text>
    <rect x="150" y="218" width="48" height="24" rx="12" fill="#475569"/>
    <circle cx="162" cy="230" r="9" fill="#FFFFFF"/>

    <text x="24" y="295" font-family="sans-serif" font-size="11" fill="#94A3B8">Campo de Texto Input:</text>
    <rect x="20" y="310" width="200" height="44" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="35" y="337" font-family="sans-serif" font-size="12" fill="#64748B">oscar@vecino.com</text>

    <text x="24" y="395" font-family="sans-serif" font-size="11" fill="#94A3B8">Tarjeta Comercio:</text>
    <rect x="20" y="410" width="200" height="120" rx="16" fill="#0F172A" stroke="#334155"/>
    <text x="35" y="440" font-family="sans-serif" font-weight="800" font-size="12" fill="#F8FAFC">Panadería La Unión</text>
    <text x="35" y="460" font-family="sans-serif" font-size="10" fill="#94A3B8">20% OFF • 300 pts</text>

    <!-- Explicación -->
    <rect x="20" y="550" width="200" height="135" rx="14" fill="#0F172A"/>
    <text x="30" y="575" font-family="sans-serif" font-weight="800" font-size="11" fill="#34D399">Estado Base</text>
    <text x="30" y="598" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Cumple contraste WCAG.</text>
    <text x="30" y="618" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Affordance físico visible.</text>
    <text x="30" y="638" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Texto nunca huérfano.</text>
    <text x="30" y="658" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Bordes 12px a 16px.</text>
  </g>

  <!-- COLUMNA 2: HOVER -->
  <g transform="translate(325, 130)">
    <rect width="240" height="710" rx="24" fill="#1E293B" stroke="#059669" stroke-width="3"/>
    <rect x="20" y="20" width="200" height="36" rx="10" fill="#065F46"/>
    <text x="120" y="44" font-family="sans-serif" font-weight="800" font-size="13" fill="#A7F3D0" text-anchor="middle">2. HOVER (Cursor)</text>
    
    <text x="24" y="90" font-family="sans-serif" font-size="11" fill="#94A3B8">Elevación + Tono claro:</text>
    <rect x="20" y="103" width="200" height="48" rx="14" fill="#047857" stroke="#34D399" stroke-width="2"/>
    <text x="120" y="133" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">Confirmar Depósito</text>

    <text x="24" y="190" font-family="sans-serif" font-size="11" fill="#94A3B8">Hover sobre Switch:</text>
    <rect x="20" y="205" width="200" height="50" rx="14" fill="#0F172A" stroke="#059669"/>
    <text x="35" y="235" font-family="sans-serif" font-size="12" fill="#FFFFFF">Modo Oscuro</text>
    <rect x="150" y="218" width="48" height="24" rx="12" fill="#64748B"/>
    <circle cx="162" cy="230" r="10" fill="#F8FAFC"/>

    <text x="24" y="295" font-family="sans-serif" font-size="11" fill="#94A3B8">Hover sobre Input:</text>
    <rect x="20" y="310" width="200" height="44" rx="12" fill="#0F172A" stroke="#059669" stroke-width="2"/>
    <text x="35" y="337" font-family="sans-serif" font-size="12" fill="#E2E8F0">oscar@vecino.com</text>

    <text x="24" y="395" font-family="sans-serif" font-size="11" fill="#94A3B8">Elevación de Card:</text>
    <rect x="18" y="406" width="204" height="124" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <text x="35" y="438" font-family="sans-serif" font-weight="800" font-size="12" fill="#34D399">Panadería La Unión</text>
    <text x="35" y="458" font-family="sans-serif" font-size="10" fill="#E2E8F0">20% OFF • 300 pts</text>

    <rect x="20" y="550" width="200" height="135" rx="14" fill="#0F172A"/>
    <text x="30" y="575" font-family="sans-serif" font-weight="800" font-size="11" fill="#34D399">Micro-Interacción</text>
    <text x="30" y="598" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Transform: translateY(-2px).</text>
    <text x="30" y="618" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Box-shadow pronunciada.</text>
    <text x="30" y="638" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Cursor: pointer en todo click.</text>
    <text x="30" y="658" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Cambio tonal inmediato.</text>
  </g>

  <!-- COLUMNA 3: ACTIVE -->
  <g transform="translate(590, 130)">
    <rect width="240" height="710" rx="24" fill="#1E293B" stroke="#D97706" stroke-width="3"/>
    <rect x="20" y="20" width="200" height="36" rx="10" fill="#78350F"/>
    <text x="120" y="44" font-family="sans-serif" font-weight="800" font-size="13" fill="#FDE68A" text-anchor="middle">3. ACTIVE (Presionado)</text>
    
    <text x="24" y="90" font-family="sans-serif" font-size="11" fill="#94A3B8">Hundimiento táctil:</text>
    <rect x="24" y="109" width="192" height="44" rx="12" fill="#064E3B" stroke="#022C22" stroke-width="2"/>
    <text x="120" y="136" font-family="sans-serif" font-weight="800" font-size="12" fill="#A7F3D0" text-anchor="middle">Confirmar Depósito</text>

    <text x="24" y="190" font-family="sans-serif" font-size="11" fill="#94A3B8">Switch activo en click:</text>
    <rect x="20" y="205" width="200" height="50" rx="14" fill="#022C22"/>
    <text x="35" y="235" font-family="sans-serif" font-size="12" fill="#FFFFFF">Modo Oscuro</text>
    <rect x="150" y="218" width="48" height="24" rx="12" fill="#10B981"/>
    <circle cx="186" cy="230" r="10" fill="#FFFFFF"/>

    <text x="24" y="295" font-family="sans-serif" font-size="11" fill="#94A3B8">Input en pulsación:</text>
    <rect x="20" y="310" width="200" height="44" rx="12" fill="#0B132B" stroke="#059669"/>
    <text x="35" y="337" font-family="sans-serif" font-size="12" fill="#FFFFFF">oscar@vecino.com</text>

    <text x="24" y="395" font-family="sans-serif" font-size="11" fill="#94A3B8">Card presionada:</text>
    <rect x="22" y="414" width="196" height="116" rx="14" fill="#064E3B" stroke="#34D399"/>
    <text x="35" y="442" font-family="sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">Panadería La Unión</text>
    <text x="35" y="462" font-family="sans-serif" font-size="10" fill="#A7F3D0">20% OFF • 300 pts</text>

    <rect x="20" y="550" width="200" height="135" rx="14" fill="#0F172A"/>
    <text x="30" y="575" font-family="sans-serif" font-weight="800" font-size="11" fill="#FCD34D">Respuesta Táctil</text>
    <text x="30" y="598" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Transform: scale(0.96).</text>
    <text x="30" y="618" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Sensación física de rebaje.</text>
    <text x="30" y="638" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Simula clic de botón mecánico.</text>
    <text x="30" y="658" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Confirma intención al usuario.</text>
  </g>

  <!-- COLUMNA 4: FOCUS -->
  <g transform="translate(855, 130)">
    <rect width="240" height="710" rx="24" fill="#1E293B" stroke="#0284C7" stroke-width="3"/>
    <rect x="20" y="20" width="200" height="36" rx="10" fill="#075985"/>
    <text x="120" y="44" font-family="sans-serif" font-weight="800" font-size="13" fill="#BAE6FD" text-anchor="middle">4. FOCUS (:focus-visible)</text>
    
    <text x="24" y="90" font-family="sans-serif" font-size="11" fill="#94A3B8">Anillo de Navegación:</text>
    <!-- Anillo focus -->
    <rect x="16" y="101" width="208" height="56" rx="18" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <rect x="20" y="105" width="200" height="48" rx="14" fill="#065F46"/>
    <text x="120" y="135" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">Confirmar Depósito</text>

    <text x="24" y="190" font-family="sans-serif" font-size="11" fill="#94A3B8">Foco por Teclado Tab:</text>
    <rect x="16" y="201" width="208" height="58" rx="18" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <rect x="20" y="205" width="200" height="50" rx="14" fill="#0F172A"/>
    <text x="35" y="235" font-family="sans-serif" font-size="12" fill="#E2E8F0">Modo Oscuro</text>
    <rect x="150" y="218" width="48" height="24" rx="12" fill="#475569"/>
    <circle cx="162" cy="230" r="9" fill="#FFFFFF"/>

    <text x="24" y="295" font-family="sans-serif" font-size="11" fill="#94A3B8">Foco en Input de Formulario:</text>
    <rect x="16" y="306" width="208" height="52" rx="16" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <rect x="20" y="310" width="200" height="44" rx="12" fill="#0F172A"/>
    <text x="35" y="337" font-family="sans-serif" font-size="12" fill="#FFFFFF">oscar@vecino.com|</text>

    <text x="24" y="395" font-family="sans-serif" font-size="11" fill="#94A3B8">Foco en Elemento Lista:</text>
    <rect x="16" y="406" width="208" height="128" rx="20" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <rect x="20" y="410" width="200" height="120" rx="16" fill="#0F172A"/>
    <text x="35" y="440" font-family="sans-serif" font-weight="800" font-size="12" fill="#F8FAFC">Panadería La Unión</text>
    <text x="35" y="460" font-family="sans-serif" font-size="10" fill="#94A3B8">20% OFF • 300 pts</text>

    <rect x="20" y="550" width="200" height="135" rx="14" fill="#0F172A"/>
    <text x="30" y="575" font-family="sans-serif" font-weight="800" font-size="11" fill="#38BDF8">Accesibilidad Universal</text>
    <text x="30" y="598" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Obligatorio WCAG 2.4.7.</text>
    <text x="30" y="618" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Anillo cian de 3px a 4px.</text>
    <text x="30" y="638" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Separación ring-offset: 2px.</text>
    <text x="30" y="658" font-family="sans-serif" font-size="10" fill="#CBD5E1">• Permite navegar 100% Tab.</text>
  </g>

  <!-- COLUMNA 5: DISABLED -->
  <g transform="translate(1120, 130)">
    <rect width="220" height="710" rx="24" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <rect x="20" y="20" width="180" height="36" rx="10" fill="#334155"/>
    <text x="110" y="44" font-family="sans-serif" font-weight="800" font-size="13" fill="#94A3B8" text-anchor="middle">5. DISABLED</text>
    
    <text x="24" y="90" font-family="sans-serif" font-size="11" fill="#94A3B8">Botón Desactivado:</text>
    <rect x="20" y="105" width="180" height="48" rx="14" fill="#334155" opacity="0.6"/>
    <text x="110" y="135" font-family="sans-serif" font-weight="800" font-size="12" fill="#64748B" text-anchor="middle">Confirmar (Bloqueado)</text>

    <text x="24" y="190" font-family="sans-serif" font-size="11" fill="#94A3B8">Switch Inactivo:</text>
    <rect x="20" y="205" width="180" height="50" rx="14" fill="#0F172A" opacity="0.5"/>
    <text x="35" y="235" font-family="sans-serif" font-size="11" fill="#64748B">Modo Oscuro</text>
    <rect x="135" y="220" width="40" height="20" rx="10" fill="#334155"/>
    <circle cx="145" cy="230" r="7" fill="#64748B"/>

    <text x="24" y="295" font-family="sans-serif" font-size="11" fill="#94A3B8">Input Deshabilitado:</text>
    <rect x="20" y="310" width="180" height="44" rx="12" fill="#1E293B" stroke="#334155" opacity="0.5"/>
    <text x="35" y="337" font-family="sans-serif" font-size="11" fill="#475569">No editable</text>

    <text x="24" y="395" font-family="sans-serif" font-size="11" fill="#94A3B8">Comercio Bloqueado:</text>
    <rect x="20" y="410" width="180" height="120" rx="16" fill="#0F172A" stroke="#334155" opacity="0.5"/>
    <text x="35" y="440" font-family="sans-serif" font-weight="800" font-size="11" fill="#64748B">TecnoRío Celulares</text>
    <text x="35" y="460" font-family="sans-serif" font-size="10" fill="#EF4444">Req. Nivel 5: Bosque</text>

    <rect x="20" y="550" width="180" height="135" rx="14" fill="#0F172A"/>
    <text x="30" y="575" font-family="sans-serif" font-weight="800" font-size="11" fill="#EF4444">Protección UX</text>
    <text x="30" y="598" font-family="sans-serif" font-size="10" fill="#94A3B8">• Cursor: not-allowed.</text>
    <text x="30" y="618" font-family="sans-serif" font-size="10" fill="#94A3B8">• Opacidad reducida 50%.</text>
    <text x="30" y="638" font-family="sans-serif" font-size="10" fill="#94A3B8">• Evita clicks duplicados.</text>
    <text x="30" y="658" font-family="sans-serif" font-size="10" fill="#94A3B8">• Mensaje conciso de causa.</text>
  </g>
</svg>