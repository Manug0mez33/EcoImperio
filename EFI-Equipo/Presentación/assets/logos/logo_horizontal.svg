<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="Logotipo Horizontal de EcoImperio">
  <rect x="2" y="2" width="516" height="136" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
