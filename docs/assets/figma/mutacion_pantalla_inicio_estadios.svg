      <text x="434" y="139" font-family="Patrick Hand, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="end">12:00</text>

      <!-- Logo simple -->
      
    <g id="wf-Img">
      <rect x="195" y="260" width="120" height="120" rx="20" fill="#E6E6E6" stroke="#333333" stroke-width="2.5"/>
      <line x1="195" y1="260" x2="315" y2="380" stroke="#595959" stroke-width="2"/>
