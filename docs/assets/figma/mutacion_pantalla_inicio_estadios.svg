      <text x="255" y="410" font-family="Kalam, sans-serif" font-weight="700" font-size="26" fill="#333333" text-anchor="middle">EcoImperio</text>
      <text x="255" y="440" font-family="Patrick Hand, sans-serif" font-size="16" fill="#666666" text-anchor="middle">App de Reciclaje</text>

