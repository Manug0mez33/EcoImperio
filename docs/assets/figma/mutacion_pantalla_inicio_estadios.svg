      <text x="255" y="570" font-family="Patrick Hand, sans-serif" font-size="15" fill="#94A3B8" text-anchor="middle">[ Sin propuesta de valor explicada ]</text>
      <text x="255" y="595" font-family="Patrick Hand, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">¿Por qué el vecino debería usarla?</text>

