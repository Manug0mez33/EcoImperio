<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="1020" viewBox="0 0 1470 1020" fill="none">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <text x="60" y="50" font-family="Kalam, Inter, sans-serif" font-weight="700" font-size="28" fill="#1E293B">EVOLUCIÓN DE PANTALLA INICIAL (SPLASH / ONBOARDING)</text>
  <text x="60" y="80" font-family="Inter, sans-serif" font-size="16" fill="#64748B">Registro de mutación progresiva: desde el boceto estructural primitivo hasta el software vivo final</text>

    <g id="Estadio-1-Primitivo">
      <!-- Tag estadio -->
