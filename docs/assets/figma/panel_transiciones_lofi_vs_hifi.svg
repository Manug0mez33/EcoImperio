<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1120" viewBox="0 0 1880 1120" fill="none">
  <rect width="100%" height="100%" fill="#F1F5F9"/>
  <text x="60" y="48" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#0F172A">PANEL DE TRANSICIONES Y MUTACIONES: LO-FI vs HI-FI (ECOIMPERIO)</text>
  <text x="60" y="76" font-family="Inter, sans-serif" font-size="15" fill="#475569">Contraste deliberado entre el boceto primitivo de baja fidelidad y el software vivo final con justificación de cambios de UX</text>

    <g id="comparativa-0">
      <text x="60" y="72" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="#0F172A">Transición 1: Mapa Barrial (screen-mapa)</text>
      <text x="60" y="92" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#64748B">De 3 círculos grises ciegos a Codificación Redundante Triple (Color + Icono + Texto Vacío/Lleno) y 3 Temas</text>

      <!-- COLUMNA IZQUIERDA: LO-FI (BAJA CALIDAD) -->
