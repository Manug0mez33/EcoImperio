      <rect x="60" y="120" width="390" height="26" fill="#374151"/>
      <text x="434" y="138" font-family="Patrick Hand, monospace" font-size="13" fill="#FFFFFF" text-anchor="end">12:00</text>
      
    <!-- LO-FI: Mapa plano básico -->
    <rect x="60" y="148" width="390" height="50" fill="#E5E7EB" stroke="#4B5563" stroke-width="2"/>
