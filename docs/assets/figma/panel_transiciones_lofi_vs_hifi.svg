    <text x="1054" y="524" font-family="Inter, sans-serif" font-size="10" fill="#7F1D1D">1. Conflicto con gestos "swipe back" de Android/iOS.</text>
    <text x="1054" y="540" font-family="Inter, sans-serif" font-size="10" fill="#7F1D1D">2. Trampas de foco de teclado para baja visión.</text>
    <text x="1054" y="556" font-family="Inter, sans-serif" font-size="10" fill="#7F1D1D">3. Desborde en pantallas pequeñas.</text>
  

