<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="Logotipo Monocromático de Alto Contraste WCAG AAA de EcoImperio">
  <!-- Fondo Negro Absoluto (#000000) con Borde Blanco Puro (#ffffff) -->
  <rect x="3" y="3" width="514" height="134" rx="24" fill="#000000" stroke="#ffffff" stroke-width="4"/>
  <!-- Isotipo Alto Contraste -->
  <g transform="translate(22, 18)">
    <circle cx="52" cy="52" r="48" fill="#000000" stroke="#ffff00" stroke-width="4"/>
    <!-- Corona Amarilla AAA -->
    <path d="M35 30 L42 19 L52 27 L62 19 L69 30 Z" fill="#ffff00" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <!-- Brote Blanco/Amarillo -->
    <path d="M52 82 V46" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M52 62 C34 62 28 45 28 36 C41 36 52 45 52 62 Z" fill="#ffff00" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M52 55 C70 55 76 38 76 29 C63 29 52 38 52 55 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M39 82 H65" stroke="#ffff00" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- Tipografía Alto Contraste (Ratio 19.56:1 y 21:1 sobre negro) -->
  <text x="142" y="72" font-family="Inter, Roboto, system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#ffff00">Eco</tspan><tspan fill="#ffffff">Imperio</tspan>
  </text>
  <text x="144" y="102" font-family="Roboto, Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="2">
    MODO ALTO CONTRASTE • WCAG AAA (19.5:1)
  </text>
  <rect x="412" y="22" width="86" height="28" rx="6" fill="#ffff00" stroke="#ffffff" stroke-width="2"/>
  <text x="455" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="#000000">AAA 7:1+</text>
</svg>
