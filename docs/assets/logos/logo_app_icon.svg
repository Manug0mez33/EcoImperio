<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="App Icon de EcoImperio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Squircle Store Badge 1:1 -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#bgGrad)" stroke="#34d399" stroke-width="3" filter="url(#softShadow)"/>
  <!-- Halo interior -->
  <circle cx="80" cy="84" r="52" fill="#047857" fill-opacity="0.35" stroke="#6ee7b7" stroke-opacity="0.3" stroke-width="1.5"/>
