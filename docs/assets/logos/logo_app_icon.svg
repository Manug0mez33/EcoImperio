  <circle cx="80" cy="26" r="3.5" fill="#fbbf24"/>
  <circle cx="95" cy="29" r="3" fill="#fbbf24"/>
  <!-- Brote Orgánico de Dos Hojas -->
  <path d="M80 124 V74" stroke="#d8f3dc" stroke-width="6" stroke-linecap="round"/>
  <path d="M80 94 C54 94 46 70 46 58 C64 58 80 70 80 94 Z" fill="#34d399" stroke="#d8f3dc" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M80 84 C106 84 114 60 114 48 C96 48 80 60 80 84 Z" fill="#6ee7b7" stroke="#d8f3dc" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Base circular -->
